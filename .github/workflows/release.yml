name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronise la version du manifest avec le tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/ekwateur/manifest.json > m.json
          mv m.json custom_components/ekwateur/manifest.json
      - name: Archive
        run: cd custom_components/ekwateur && zip -r ../../ekwateur.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: ekwateur.zip
